# Local Postgres/Redis plus Pages API (run Angular on the host).
# Default DB is `pages` (POSTGRES_DB). If you already had a volume with another DB name, remove the volume or recreate data.

name: local-dev

services:
  db:
    image: postgres:17-alpine
    container_name: local-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pages
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: local-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/api:/app
    ports:
      - "${API_PORT:-8002}:8000"
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pages
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_ORIGINS=["http://localhost:4200"]
    depends_on:
      - db
      - redis

volumes:
  db-data:
  redis-data:
